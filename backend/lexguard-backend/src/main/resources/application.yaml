spring:
  application:
    name: lexguard-backend

  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: 60000

  ai:
    google:
      genai:
        # Chat connection
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash
            temperature: 0.2

        # Embedding connection (separate namespace, needs its own api-key)
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            options:
              model: gemini-embedding-001
              dimensions: 768

    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        dimensions: 768
        distance-type: COSINE_DISTANCE

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

logging:
  level:
    org.hibernate.orm.connections.pooling: WARN
    org.springframework.ai.vectorstore.pgvector: WARN